# fixed offset clear of it -- ld65 errors here the day btlgfx_code grows
# past $ffe7, which is the tripwire we want (see ot6.asm OT6_ANIMTICK).
    ot6_c1: load = bank_c1, type = ro, offset = $ffe8;
